version: '3.8'

# =============================================================================
# Airflow 3.x Docker Compose Configuration
# =============================================================================
#
# This configuration runs Airflow with:
# - LocalExecutor (single-machine, no Celery/Redis needed)
# - PostgreSQL databases (separate for Airflow metadata and app data)
# - @task.virtualenv support for SQLAlchemy 2.0+ isolation
#
# IMPORTANT: Host directories (logs, venv_cache) must be owned by uid 50000
# Run: mkdir -p logs venv_cache && sudo chown -R 50000:0 logs venv_cache

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Limit parallelism for local development
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: 1
    # Airflow metadata database (separate from app database)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-postgresql+psycopg://airflow:airflow@postgres:5432/airflow}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    # Simple Auth Manager (SAM) - default in Airflow 3.x
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: '${AIRFLOW_ADMIN_USER:-admin}:admin'
    # Secret keys (must be same across all containers)
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-production}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-change-me-in-production}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
    # Logging
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    # Task SDK execution API
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    # Application settings
    APP_MODE: production
    # Application database (for your models)
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@postgres:5432/app}
  # Run as airflow user (uid 50000)
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./packages:/opt/airflow/packages:ro
    - ./logs:/opt/airflow/logs
    - ./venv_cache:/opt/airflow/venv_cache
    - ./alembic:/opt/airflow/alembic:ro
    - ./alembic.ini:/opt/airflow/alembic.ini:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  # PostgreSQL with two databases: airflow (metadata) and app (your data)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Initialize Airflow database
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Airflow 3.x uses 'db migrate' instead of 'db init'
        airflow db migrate
        echo "Airflow database initialized!"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Airflow API Server (replaces webserver in Airflow 3.x)
  airflow-webserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
