[project]
name = "api"
version = "0.1.0"
description = "FastAPI endpoints for NRECA document ingestion and RAG queries"
requires-python = ">=3.12"
dependencies = [
    "utils",
    "vectordb",
    "db",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
