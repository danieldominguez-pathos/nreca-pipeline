[project]
name = "storage"
version = "0.1.0"
description = "Unified file storage abstraction for S3 and local filesystem"
requires-python = ">=3.12"
dependencies = [
    "utils",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
