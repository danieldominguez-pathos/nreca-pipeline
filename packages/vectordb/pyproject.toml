[project]
name = "vectordb"
version = "0.1.0"
description = "ChromaDB vector database client for querying (no embeddings)"
requires-python = ">=3.12"
dependencies = [
    "utils",
    "chromadb>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vectordb"]
